<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff9d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ff9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" rx="12" ry="12"/>

  <!-- Animated moving background lines -->
  <g stroke="#00f0ff" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="30" x2="800" y2="30">
      <animate attributeName="stroke-opacity" values="0.10;0.25;0.10" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 220" dur="12s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="80" x2="800" y2="80">
      <animate attributeName="stroke-opacity" values="0.10;0.20;0.10" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 170" dur="15s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="140" x2="800" y2="140">
      <animate attributeName="stroke-opacity" values="0.10;0.30;0.10" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 110" dur="18s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="200" x2="800" y2="200">
      <animate attributeName="stroke-opacity" values="0.10;0.20;0.10" dur="4.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 50" dur="14s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Animated diagonal scan lines -->
  <g stroke="url(#accentGrad)" stroke-opacity="0.06" stroke-width="1">
    <line x1="-100" y1="0" x2="200" y2="250">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="10s" repeatCount="indefinite"/>
    </line>
    <line x1="-100" y1="0" x2="200" y2="250">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="10s" begin="3s" repeatCount="indefinite"/>
    </line>
    <line x1="-100" y1="0" x2="200" y2="250">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="700 0" dur="10s" begin="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Decorative circuit lines -->
  <g stroke="url(#accentGrad)" stroke-width="2" fill="none" stroke-opacity="0.7" filter="url(#glow)">
    <path d="M 30 220 L 30 180 L 60 180 L 60 150"/>
    <circle cx="60" cy="150" r="4" fill="#00f0ff" stroke="none"/>
    <path d="M 770 30 L 770 70 L 740 70 L 740 100"/>
    <circle cx="740" cy="100" r="4" fill="#00ff9d" stroke="none"/>
  </g>

  <!-- Main content -->
  <g transform="translate(160, 90)">
    <!-- Terminal prompt -->
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#00ff9d" fill-opacity="0.6">
      <text x="0" y="0">$ whoami</text>
    </g>

    <!-- Name -->
    <text x="0" y="45" font-family="'Orbitron', 'Space Grotesk', sans-serif" font-size="38" font-weight="700" fill="url(#accentGrad)" filter="url(#glow)">MAZOUZ ABDERRAHMANE</text>

    <!-- Title -->
    <text x="0" y="75" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#c9f9ff" letter-spacing="1.5">STUDENT IN COMPUTER SCIENCE</text>
  </g>

  <!-- Animated blue border line (longer and slower) -->
  <rect x="2" y="2" width="796" height="246" rx="10" ry="10" fill="none" stroke="url(#borderGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="500 1600" stroke-dashoffset="0" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2100" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Hexagon decorations -->
  <g stroke="#00f0ff" stroke-opacity="0.15" stroke-width="1" fill="none">
    <path d="M 700 160 L 710 154 L 720 160 L 720 170 L 710 176 L 700 170 Z"/>
    <path d="M 725 170 L 735 164 L 745 170 L 745 180 L 735 186 L 725 180 Z"/>
  </g>
</svg>
